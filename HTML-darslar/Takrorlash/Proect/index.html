<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
    </style>
</head>
<body style="background-color: lightblue; padding: 50px;">
    <header style="height: 70px; background-color: white; border-radius: 15px; text-align: center; padding-top: 20px;">
        Header
    </header>
    <div style="display: flex; gap: 20px; margin: 20px 0; height: 60vh;">
        <nav style="height: 100%; width: 20%; padding: 50px; background-color: white; border-radius: 15px; text-align: center; padding-top: 190px;">
            Navbar
        </nav>
        <main style="height: 100%; width: 80%; padding: 50px; background-color: white; border-radius: 15px; text-align: center; padding-top: 190px;">
            Main
        </main>
    </div>
    <footer style="width: 100%; padding: 40px; background-color: white; border-radius: 15px; text-align: center; height: 80px;">
        Footer
    </footer>
</body>
</html>
