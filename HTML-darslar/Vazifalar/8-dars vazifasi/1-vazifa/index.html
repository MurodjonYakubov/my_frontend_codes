<!DOCTYPE html>
<html>
<head>
    <title>My Feedback Form</title>
</head>
<body>

    <h1>My Feedback Form</h1>

    <form>
        <dl>
            <dt>• Name:</dt>
            <dd><input type="text" id="name" name="name"></dd>
            <dt>• Email:</dt>
            <dd><input type="email" id="email" name="email"></dd>
            <dt>• Password:</dt>
            <dd><input type="password" id="password" name="password"></dd>
        </dl>

        <dl>
            <dt>• Please check all the emotions that apply to you:</dt>
            <dd>
                <input type="checkbox" id="angry" name="emotion" value="Angry">
                <label for="angry"> Angry</label>
            </dd>
            <dd>
                <input type="checkbox" id="sad" name="emotion" value="Sad">
                <label for="sad"> Sad</label>
            </dd>
            <dd>
                <input type="checkbox" id="happy" name="emotion" value="Happy">
                <label for="happy"> Happy</label>
            </dd>
            <dd>
                <input type="checkbox" id="ambivalent" name="emotion" value="Ambivalent">
                <label for="ambivalent"> Ambivalent</label>
            </dd>
        </dl>

        <dl>
            <dt>• How satisfied were you with our service?</dt>
            <dd>
                <input type="radio" id="verySatisfied" name="satisfaction" value="Very satisfied">
                <label for="verySatisfied"> Very satisfied</label>
            </dd>
            <dd>
                <input type="radio" id="satisfied" name="satisfaction" value="Satisfied">
                <label for="satisfied"> Satisfied</label>
            </dd>
            <dd>
                <input type="radio" id="didntCare" name="satisfaction" value="Didn't care">
                <label for="didntCare"> Didn't care</label>
            </dd>
            <dd>
                <input type="radio" id="dissatisfied" name="satisfaction" value="Dissatisfied">
                <label for="dissatisfied"> Dissatisfied</label>
            </dd>
            <dd>
                <input type="radio" id="veryDissatisfied" name="satisfaction" value="Very dissatisfied">
                <label for="veryDissatisfied"> Very dissatisfied</label>
            </dd>
        </dl>
    </form>

</body>
</html>
