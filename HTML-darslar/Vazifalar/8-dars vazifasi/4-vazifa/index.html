<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Registration Form</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #e6e6fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 500px;
        }

        .container {
            background-color: #c9c9ff; /* Lighter purple container */
            padding: 30px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 5px;
        }

        input[type="text"],
        input[type="email"],
        input[type="number"],
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 3px;
        }

        input[type="date"] {
            width: calc(100% - 30px); /* Space for potential calendar icon */
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 3px;
        }

        .gender-group {
            display: flex;
            flex-wrap: wrap; /* Allow wrapping on smaller screens */
        }

        .gender-group label {
            margin-right: 15px;
            margin-bottom: 0;
        }

        button {
            background-color: #4CAF50; /* Green button */
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 3px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div style="width: 1000px; height: 600px; background-color: blueviolet;">
        <div style="width: 400; height: 550;" class="container">
            <h2>Registration Form</h2>
            <form>
                <div class="form-group">
                    <label for="fullName">Full Name:</label>
                    <input type="text" id="fullName" placeholder="Enter full name" required>
                </div>
                <div class="form-group">
                    <label for="email">Email Address:</label>
                    <input type="email" id="email" placeholder="Enter email address" required>
                </div>
                <div class="form-group">
                    <label for="mobileNumber">Mobile Number:</label>
                    <input type="number" id="mobileNumber" placeholder="Enter mobile number" required>
                </div>
                <div class="form-group">
                    <label for="birthDate">Birth Date:</label>
                    <input type="date" id="birthDate" required>
                </div>
                <div class="form-group gender-group">
                    <label for="male">
                        <input type="radio" id="male" name="gender" value="male">
                        Male
                    </label>
                    <label for="female">
                        <input type="radio" id="female" name="gender" value="female">
                        Female
                    </label>
                    <label for="other">
                        <input type="radio" id="other" name="gender" value="other">
                        Prefer not to say
                    </label>
                </div>
                <div class="form-group">
                    <label for="address">Address:</label>
                    <textarea id="address" rows="3" placeholder="Enter address" required></textarea>
                </div>
                <div class="form-group">
                    <label for="country">Country:</label>
                    <select id="country" required>
                        <option value="">Select Country</option>
                        {/* Add country options here */}
                    </select>
                </div>
                <div class="form-group">
                    <label for="postalCode">Postal Code:</label>
                    <input type="text" id="postalCode" placeholder="Enter postal code" required>
                </div>
                <button type="submit">Submit</button>
            </form>
        </div>
    </div>
</body>
</html>
