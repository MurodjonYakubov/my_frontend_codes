<!DOCTYPE html>
<html>
<head>
  <title>Login</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
    }

    .container {
      width: 300px;
      height: 400px;
      margin: 0 auto;
      padding: 20px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    h1 {
      margin-bottom: 20px;
    }

    .social-buttons {
      margin-bottom: 20px;
    }

    .social-buttons button {
      background-color: #fff;
      border: 1px solid #ccc;
      border-radius: 5px;
      padding: 10px 20px;
      margin: 0 5px;
      cursor: pointer;
    }
    input[type="text"],
    input[type="password"] {
      width: 90%;
      padding: 10px;
      margin-bottom: 10px;
      border: 1px solid #ccc;
      border-radius: 3px;
    }

    button {
      background-color: #ff1c03;
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 3px;
      cursor: pointer;
    }

    a {
      color: #333;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Login</h1>
    <br><br>
    <p>or use your account</p>

    <input type="text" placeholder="Email" required>
    <br>
    <br>
    <input type="password" placeholder="Password" required>
    <br><br>

    <a href="#">Forgot your password?</a>
    <br>
    <br>
    <br>

    <button style="border-radius: 50px;">Log in</button>
  </div>

</body>
</html>
