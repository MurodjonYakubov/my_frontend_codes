<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Document</title>
  <link rel="stylesheet" href="./css/style.css" />
</head>

<body>
  <div class="box one">
    <img src="./assets/icons/logo.svg" alt="" />

    <div class="icons">
      <img src="./assets/icons/icon1.svg" alt="" />
      <img src="./assets/icons/icon2.svg" alt="" />
      <img src="./assets/icons/icon3.svg" alt="" />
      <img src="./assets/icons/icon4.svg" alt="" />
      <img src="./assets/icons/icon5.svg" alt="" />
    </div>

    <img src="./assets/icons/icon6.svg" alt="" />
  </div>

  <div class="box two">
    <div class="innerBox">
      <h1>Hello Josh!</h1>
      <p>It’s good to see you again.</p>
      <img src="./assets/icons/josh.svg" alt="" />
    </div>

    <div class="cource">
      <div class="left">
        <div class="flegbox">
          <img src="./assets/icons/Fleg.svg" alt="">
        </div>

        <div class="title">
          <h3>Spanish B2</h3>
          <p>by Alejandro Velazquez</p>
        </div>

        <div class="ellipsebox">
          <span>83%</span>
          <img src="./assets/icons/Ellipse.svg" alt="">
        </div>
        
        <button>Continue</button>
      </div>

      <div class="right">
        <img src="./assets/icons/Left Arrow.svg" alt="">
        <img src="./assets/icons/Right Arrow.svg" alt="">
      </div>
    </div>

    <div class="courceItem">
      <h2>Cource</h2>
    </div>
  </div>
  <div class="box three"></div>

</html>
